name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily
  workflow_dispatch:

permissions:
  contents: write   # 🔥 THIS FIXES YOUR 403 ERROR

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: 10rishikrishna
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=39FF14&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39FF14
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=39FF14

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
